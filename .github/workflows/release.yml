# Publishes GitHub Release assets (cross-platform zips + SHA256SUMS, GPG-signed,
# plus the registry manifest declaring protocol 6.0) for any tag matching "v*"
# (e.g. v1.0.0), for registry.opentofu.org.
#
# Requires repo secrets GPG_PRIVATE_KEY and PASSPHRASE for the "nitra" provider
# signing key (public key registered at registry.opentofu.org).
name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
